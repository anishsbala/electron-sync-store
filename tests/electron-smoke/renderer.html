<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>electron-sync-store smoke</title>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "@electron-sync-store/core": "../../packages/core/dist/index.js"
        }
      }
    </script>
    <script type="module">
      import { createRendererStore } from "../../packages/renderer/dist/index.js";

      let store;
      let commitPromise;

      window.startElectronSyncStoreSmoke = async () => {
        store = await createRendererStore({ id: "app" });
        return {
          state: store.getState(),
          sync: store.getSyncState(),
        };
      };

      window.armElectronSyncStoreCommitWait = () => {
        commitPromise = new Promise((resolve) => {
          const unsubscribe = store.subscribe((state) => {
            unsubscribe();
            resolve({ state, sync: store.getSyncState() });
          });
        });
        return true;
      };

      window.waitForElectronSyncStoreCommit = () => commitPromise;
    </script>
  </body>
</html>
