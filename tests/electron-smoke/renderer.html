<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>electron-sync-store smoke</title>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "@electron-sync-store/core": "../../packages/core/dist/index.js"
        }
      }
    </script>
    <script type="module">
      import { createRendererStore } from "../../packages/renderer/dist/index.js";

      let store;
      let synchronizationPromise;

      window.startElectronSyncStoreSmoke = async () => {
        store = await createRendererStore({ id: "app" });
        return {
          state: store.getState(),
          sync: store.getSyncState(),
        };
      };

      window.armElectronSyncStoreCommitWait = (revision, counter) => {
        synchronizationPromise = new Promise((resolve) => {
          const finishIfReady = () => {
            const sync = store.getSyncState();
            const state = store.getState();
            if (
              sync.status === "synced" &&
              sync.revision === revision &&
              sync.pendingMutations === 0 &&
              state.counter === counter
            ) {
              unsubscribeState();
              unsubscribeSync();
              resolve({ state, sync });
            }
          };
          const unsubscribeState = store.subscribe(finishIfReady);
          const unsubscribeSync = store.subscribeSync(finishIfReady);
          queueMicrotask(finishIfReady);
        });
        return true;
      };

      window.performElectronSyncStoreMutation = (counter) => {
        store.setState({ counter });
        return {
          state: store.getState(),
          sync: store.getSyncState(),
        };
      };

      window.waitForElectronSyncStoreCommit = () => synchronizationPromise;
    </script>
  </body>
</html>
